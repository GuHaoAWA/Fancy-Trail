// 1.21.1 NeoForge port build — MDG 2.0 template (same shape as our efn/vix ports).
plugins { id 'net.neoforged.moddev' version '2.0.141' }
group = project.findProperty('mod_group_id')
version = project.findProperty('mod_version')
base { archivesName = 'Fancy-Trail-1.21.1-neoforge' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    flatDir { dirs 'libs' }
}
tasks.named('processResources', ProcessResources).configure {
    var props = [mod_id: project.findProperty('mod_id'), mod_name: project.findProperty('mod_name'),
                 mod_license: project.findProperty('mod_license'), mod_version: project.findProperty('mod_version'),
                 mod_authors: project.findProperty('mod_authors'), mod_description: project.findProperty('mod_description')]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
}
neoForge {
    version = project.findProperty('neoforge_version')
    // AT converted to 1.21.1 Mojmap names (same entry list as our vix port; see that port's
    // validated descriptor drift notes: Camera.getMaxZoom (D)D -> (F)F, Camera.move (DDD)V ->
    // (FFF)V, GameRenderer.positionColorTexShader removed).
    validateAccessTransformers = true
    parchment {
        minecraftVersion = project.findProperty('parchment_mc')
        mappingsVersion  = project.findProperty('parchment_version')
    }
    runs {
        client { client(); gameDirectory = project.file('run') }
        server { server(); gameDirectory = project.file('run-server'); programArgument 'nogui' }
    }
    mods { fancy_trail { sourceSet sourceSets.main } }
}
dependencies {
    implementation files('libs/epicfight.jar') // Epic Fight 21.17.3.1 (our stack)
    implementation files('libs/vix.jar')       // VIX 1.0.9 (our 1.21.1 port)
    // Upstream 1.20.1 embeddium/oculus compat and the mixinsquared/mixinextras jarJar plumbing
    // were dropped: no fancy-trail source imports them (dead perf-compat on 1.21.1 NeoForge).
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
